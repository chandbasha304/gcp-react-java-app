name: CD - Deploy Monolith Web App to GCP VM

# Disabled automatic push triggers per user instruction. Use workflow_dispatch to run manually.
on:
  workflow_dispatch:

jobs:
  deploy-to-gcp-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Port Mapping
        id: env-check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "PORT_MAPPING=80:80" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "PORT_MAPPING=8080:80" >> $GITHUB_OUTPUT
          fi

      - name: Deploy & Launch Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Deploying Monolith Web App to GCP VM (Env: ${{ steps.env-check.outputs.ENV_NAME }}) ==="
            mkdir -p /home/${{ secrets.VM_USER }}/app
            cd /home/${{ secrets.VM_USER }}/app
            
            echo "Cloning/Updating source code on VM..."
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/${{ steps.env-check.outputs.ENV_NAME }}
            else
              git clone -b ${{ steps.env-check.outputs.ENV_NAME }} https://github.com/chandbasha304/gcp-react-java-app.git .
            fi
            
            echo "Building Docker container image on GCP VM..."
            docker build -t gcp-monolith-app:${{ steps.env-check.outputs.ENV_NAME }} .
            
            echo "Restarting application container on Port ${{ steps.env-check.outputs.PORT_MAPPING }}..."
            docker stop gcp-monolith-${{ steps.env-check.outputs.ENV_NAME }} || true
            docker rm gcp-monolith-${{ steps.env-check.outputs.ENV_NAME }} || true
            
            docker run -d \
              --name gcp-monolith-${{ steps.env-check.outputs.ENV_NAME }} \
              -p ${{ steps.env-check.outputs.PORT_MAPPING }} \
              --restart always \
              gcp-monolith-app:${{ steps.env-check.outputs.ENV_NAME }}
            
            echo "=== Container Status ==="
            docker ps | grep gcp-monolith
            echo "=== Deployment Completed Successfully on GCP VM! ==="
