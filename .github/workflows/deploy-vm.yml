name: CD - Deploy Monolith Web App to GCP VM

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  deploy-to-gcp-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Port Mapping
        id: env-check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "PORT_MAPPING=80:80" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "PORT_MAPPING=8080:80" >> $GITHUB_OUTPUT
          fi

      - name: Build Application Container Image
        run: |
          docker build -t gcp-monolith-app:${{ steps.env-check.outputs.ENV_NAME }}-${{ github.sha }} .

      - name: Save Docker Image to Archive
        run: |
          docker save gcp-monolith-app:${{ steps.env-check.outputs.ENV_NAME }}-${{ github.sha }} | gzip > app_image.tar.gz

      - name: Copy Image Archive & Docker Compose to GCP VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "app_image.tar.gz,docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}/app"

      - name: Load Image & Launch Container on GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "=== Deploying Monolith Web App to GCP VM (Env: ${{ steps.env-check.outputs.ENV_NAME }}) ==="
            cd /home/${{ secrets.VM_USER }}/app
            
            echo "Loading Docker container image..."
            gunzip -c app_image.tar.gz | docker load
            rm -f app_image.tar.gz
            
            echo "Restarting application container on Port ${{ steps.env-check.outputs.PORT_MAPPING }}..."
            docker stop gcp-monolith-${{ steps.env-check.outputs.ENV_NAME }} || true
            docker rm gcp-monolith-${{ steps.env-check.outputs.ENV_NAME }} || true
            
            docker run -d \
              --name gcp-monolith-${{ steps.env-check.outputs.ENV_NAME }} \
              -p ${{ steps.env-check.outputs.PORT_MAPPING }} \
              --restart always \
              gcp-monolith-app:${{ steps.env-check.outputs.ENV_NAME }}-${{ github.sha }}
            
            echo "=== Live Container Status ==="
            docker ps | grep gcp-monolith
            echo "=== Deployment Completed Successfully on GCP VM! ==="
