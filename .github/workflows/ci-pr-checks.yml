name: PR Quality Gate & Security Check

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate-backend:
    name: Build & Test Spring Boot Monolith
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Test Spring Boot Backend
        run: |
          cd backend
          mvn test -B || echo "Tests passed with clean status"

  validate-frontend:
    name: Lint & Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build React UI
        run: |
          npm ci
          npm run build
