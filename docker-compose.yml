version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: monolith_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  gcp-monolith-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcp-monolith-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=monolith_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
    depends_on:
      - postgres-db
    restart: always

volumes:
  postgres_data:
