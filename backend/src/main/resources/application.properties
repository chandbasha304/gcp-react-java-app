server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:monolith_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Okta / Google OpenID Connect (OIDC) Single Sign-On Configuration
spring.security.oauth2.client.registration.okta.client-id=${OKTA_CLIENT_ID:okta-demo-client-id}
spring.security.oauth2.client.registration.okta.client-secret=${OKTA_CLIENT_SECRET:okta-demo-client-secret}
spring.security.oauth2.client.registration.okta.scope=openid,profile,email
spring.security.oauth2.client.provider.okta.issuer-uri=${OKTA_ISSUER_URI:https://dev-demo.okta.com/oauth2/default}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-demo-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-demo-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

